<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error": "#ffb4ab",
                        "primary-container": "#9080fa",
                        "surface-container": "#201f22",
                        "inverse-on-surface": "#313032",
                        "tertiary-fixed-dim": "#f9bd45",
                        "on-secondary": "#302a56",
                        "inverse-primary": "#5c4bc3",
                        "surface-dim": "#131315",
                        "error-container": "#93000a",
                        "secondary-container": "#494371",
                        "secondary-fixed": "#e5deff",
                        "on-tertiary-fixed": "#271900",
                        "inverse-surface": "#e5e1e4",
                        "on-primary-fixed-variant": "#4430aa",
                        "on-surface": "#e5e1e4",
                        "on-tertiary": "#422d00",
                        "on-secondary-fixed": "#1b1540",
                        "surface-container-low": "#1c1b1d",
                        "on-error": "#690005",
                        "surface-container-high": "#2a2a2c",
                        "tertiary-fixed": "#ffdea8",
                        "secondary-fixed-dim": "#c8c0f6",
                        "primary-fixed-dim": "#c8bfff",
                        "on-secondary-container": "#bab2e7",
                        "secondary": "#c8c0f6",
                        "background": "#131315",
                        "surface-container-highest": "#353437",
                        "on-tertiary-fixed-variant": "#5e4200",
                        "on-primary-fixed": "#190064",
                        "on-primary": "#2d0e94",
                        "surface-container-lowest": "#0e0e10",
                        "on-surface-variant": "#c9c4d5",
                        "surface-variant": "#353437",
                        "on-primary-container": "#26008b",
                        "outline": "#928f9f",
                        "surface-bright": "#39393b",
                        "on-error-container": "#ffdad6",
                        "surface": "#131315",
                        "tertiary": "#f9bd45",
                        "primary-fixed": "#e5deff",
                        "on-tertiary-container": "#392600",
                        "surface-tint": "#c8bfff",
                        "tertiary-container": "#bc8708",
                        "on-secondary-fixed-variant": "#47416e",
                        "outline-variant": "#474553",
                        "on-background": "#e5e1e4",
                        "primary": "#c8bfff"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"],
                        "mono": ["JetBrains Mono"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        body {
            background-color: #09090B; /* Override base background per prompt */
        }
    </style>
</head>
<body class="font-body text-on-surface antialiased flex items-center justify-center min-h-screen p-4">
<!-- The Navigation Shell is suppressed for Transactional Login Flow as per the Semantic Shell Mandate -->
<main class="w-full max-w-[400px] flex flex-col items-center gap-8">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center gap-4 text-center">
<div class="w-12 h-12 flex items-center justify-center bg-surface-container-low rounded-xl">
<!-- Abstract Stacked Stones Icon (Deft) -->
<div class="flex flex-col items-center -space-y-1">
<div class="w-4 h-2 bg-primary rounded-full opacity-60"></div>
<div class="w-6 h-2 bg-primary rounded-full opacity-80"></div>
<div class="w-8 h-2.5 bg-primary-container rounded-full"></div>
</div>
</div>
<div class="space-y-1">
<h1 class="font-headline text-on-surface text-[1.25rem] font-semibold tracking-tight">Deft AI</h1>
<p class="font-body text-on-surface-variant text-[0.875rem]">Sign in to your workspace</p>
</div>
</div>
<!-- Authentication Card -->
<div class="w-full bg-[#111113] p-8 rounded-xl flex flex-col gap-6 shadow-2xl ring-1 ring-white/5">
<!-- Standard Login Form -->
<form class="flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="font-label text-on-surface-variant text-[0.6875rem] font-semibold uppercase tracking-[0.05em]" for="email">Email Address</label>
<input class="w-full h-11 px-4 bg-surface-container-low border border-white/10 rounded-lg text-[0.875rem] placeholder:text-on-surface-variant/30 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all duration-150" id="email" placeholder="name@company.com" type="email"/>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label text-on-surface-variant text-[0.6875rem] font-semibold uppercase tracking-[0.05em]" for="password">Password</label>
<a class="text-[0.75rem] text-primary/80 hover:text-primary transition-colors" href="#">Forgot?</a>
</div>
<input class="w-full h-11 px-4 bg-surface-container-low border border-white/10 rounded-lg text-[0.875rem] placeholder:text-on-surface-variant/30 focus:outline-none focus:ring-2 focus:ring-primary/30 transition-all duration-150" id="password" placeholder="••••••••" type="password"/>
</div>
<button class="w-full h-11 bg-primary-container text-on-primary-container font-semibold rounded-lg text-[0.875rem] mt-2 active:scale-[0.98] transition-all duration-150 hover:saturate-150" type="submit">
                    Sign in
                </button>
</form>
<!-- Divider -->
<div class="flex items-center gap-4 py-2">
<div class="h-px flex-1 bg-white/5"></div>
<span class="font-label text-on-surface-variant/40 text-[0.625rem] uppercase tracking-widest">or continue with</span>
<div class="h-px flex-1 bg-white/5"></div>
</div>
<!-- SSO Options -->
<div class="flex flex-col gap-3">
<button class="w-full h-11 bg-surface-container-low text-on-surface border border-white/5 rounded-lg text-[0.875rem] flex items-center justify-center gap-3 hover:bg-surface-container-highest transition-colors active:scale-[0.98]">
<svg class="w-4 h-4" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Continue with Google
                </button>
</div>
</div>
<!-- Footer Link -->
<p class="text-[0.875rem] text-[#8B8B8E]">
            Don't have an account? 
            <a class="text-primary hover:underline underline-offset-4 decoration-primary/40 transition-all" href="#">Sign up</a>
</p>
</main>
<!-- Decorative Subtle Backdrop Gradients (No heavy texture, just soft atmospheric light) -->
<div class="fixed top-0 left-1/4 w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
<div class="fixed bottom-0 right-1/4 w-[600px] h-[600px] bg-secondary-container/5 rounded-full blur-[140px] -z-10 pointer-events-none"></div>
</body></html>
