services:
  deft:
    build: .
    ports:
      - '3000:3000'
      - '3001:3001'
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/deft
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  postgres:
    # pgvector image ships a standard postgres:16 with the `vector`
    # extension pre-built. Deft's wiki + tasks embeddings columns are
    # declared as `vector(1536)` in the Drizzle schema, so `db:push`
    # fails against plain postgres:16-alpine on a fresh volume.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deft
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # On first boot, enable the vector extension in the `deft` database.
      # Scripts in /docker-entrypoint-initdb.d run once, only when the
      # data directory is empty — so upgrades of existing deployments
      # won't re-run this.
      - ./scripts/docker/enable-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  uploads:
