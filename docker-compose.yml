services:
  deft:
    build:
      context: .
      # NEXT_PUBLIC_* must be present at build time — Next.js bakes them
      # into the client JS bundle. Compose interpolates ${VAR} from the
      # host .env automatically.
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
    ports:
      - '3000:3000'
      - '3001:3001'
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — generate with `openssl rand -hex 32`}@postgres:5432/deft
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

  postgres:
    # pgvector image ships a standard postgres:16 with the `vector`
    # extension pre-built. Deft's wiki + tasks embeddings columns are
    # declared as `vector(1536)` in the Drizzle schema, so `db:push`
    # fails against plain postgres:16-alpine on a fresh volume.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required — generate with `openssl rand -hex 32`}
      POSTGRES_DB: deft
    ports:
      # SECURITY: bind to loopback only. Docker's iptables NAT rules sit
      # ABOVE ufw, so `ports: '5432:5432'` would expose postgres to the
      # public internet regardless of `ufw deny`. PG attackers scan the
      # whole IPv4 space for 5432 and try default creds — this is how the
      # 2026-05-11 incident happened on a test deploy. Localhost-only
      # binding keeps it reachable from host-side dev tools but invisible
      # to the public. Use `compose.prod.yml` to drop the binding entirely
      # for hardened production deploys; containers still talk to each
      # other on the internal docker network.
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # On first boot, enable the vector extension in the `deft` database.
      # Scripts in /docker-entrypoint-initdb.d run once, only when the
      # data directory is empty — so upgrades of existing deployments
      # won't re-run this.
      - ./scripts/docker/enable-pgvector.sql:/docker-entrypoint-initdb.d/01-enable-pgvector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # SECURITY: see the postgres `ports` comment above. Redis with no
      # password (default) plus public exposure is an instant
      # cryptojacking on-ramp via `CONFIG SET dir / SAVE` shell escapes.
      # Loopback-only binding keeps it reachable for host-side dev tools.
      - '127.0.0.1:6379:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  uploads:
