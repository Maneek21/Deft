# Use this overlay with docker-compose.yml to run a named GHCR release without
# compiling the monorepo locally. Keep compose.prod.yml in the stack for public
# deployments so Postgres is not published to the host.
x-deft-release-image: &deft-release-image
  # No implicit legacy tag: releases through v0.2.0-preview.4 retain the BSL
  # terms shipped with those revisions. Operators must deliberately select a
  # published AGPL-3.0-only image for this AGPL source tree.
  image: ${DEFT_IMAGE:?Set DEFT_IMAGE to a published AGPL-3.0-only Deft image}
  pull_policy: always
  build: !reset null

services:
  deft:
    <<: *deft-release-image

  init:
    <<: *deft-release-image

  upgrade:
    <<: *deft-release-image

  doctor:
    <<: *deft-release-image

  smoke:
    <<: *deft-release-image
