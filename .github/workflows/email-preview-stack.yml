name: Email preview stack checks

on:
  push:
    branches:
      - codex/author-kit-external-email-alpha32
      - codex/email-preview-host-reviewed-20261013
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character source commit to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: email-preview-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      RAYON_NUM_THREADS: '1'
      UV_THREADPOOL_SIZE: '1'
      NEXT_PUBLIC_APP_URL: __DEFT_APP_URL__
      NEXT_PUBLIC_API_URL: __DEFT_API_URL__
      NEXT_PUBLIC_WS_URL: __DEFT_WS_URL__
      NEXT_PUBLIC_FEATURE_APPS: 'true'
      NEXT_PUBLIC_FEATURE_APP_RESOURCE_SYNC: 'true'
      NEXT_PUBLIC_FEATURE_APP_ATTACHMENT_BROKER: 'true'
      NEXT_PUBLIC_DEFT_SELF_HOSTED: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Record source and runner capacity
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          mkdir -p .ci-diagnostics
          git rev-parse HEAD > .ci-diagnostics/source-commit.txt
          free -m > .ci-diagnostics/memory-before.txt
          df -m . > .ci-diagnostics/disk-before.txt
          requested="$REQUESTED_COMMIT"
          if [ -n "$requested" ]; then
            [[ "$requested" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$requested"
          fi
          test "$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)" -ge 8388608
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 8388608
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact dependency graph
        id: install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci-diagnostics/install.log
      - name: Full Kit normal and packed consumer suite
        id: kit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/app-kit test 2>&1 | tee .ci-diagnostics/kit-normal-packed.log
      - name: Full candidate API typecheck
        id: api
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/api exec tsc -p tsconfig.typecheck.json --incremental false 2>&1 | tee .ci-diagnostics/api-typecheck.log
      - name: Full candidate Web typecheck
        id: web
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/web exec tsc --noEmit --incremental false 2>&1 | tee .ci-diagnostics/web-typecheck.log
      - name: Exposure error mapping and schema contract regressions
        id: focused
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/api exec tsx --test --test-concurrency=1 test/app-http-exposure-error.test.ts test/email-account-catalog.test.ts 2>&1 | tee .ci-diagnostics/host-focused.log
          node --test packages/db/scripts/fresh-schema-contracts.test.mjs 2>&1 | tee .ci-diagnostics/schema-contracts.log
          pnpm --filter @deft/shared exec tsx --test test/native-mentions.test.ts 2>&1 | tee .ci-diagnostics/native-mention-contracts.log
          pnpm --filter @deft/web exec tsx --test src/lib/email-native-navigation.test.ts 2>&1 | tee .ci-diagnostics/native-email-navigation.log
          node --test apps/web/src/lib/app-experience-consent-presentation.test.mjs 2>&1 | tee .ci-diagnostics/consent-presentation.log
      - name: Compile production Web
        id: build
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/web exec next build --webpack 2>&1 | tee .ci-diagnostics/web-build.log
      - name: Report every gate and fail incomplete closure
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          KIT: ${{ steps.kit.outcome }}
          API: ${{ steps.api.outcome }}
          WEB: ${{ steps.web.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          mkdir -p .ci-diagnostics
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const gates=Object.fromEntries(['INSTALL','KIT','API','WEB','FOCUSED','BUILD'].map(key=>[key,process.env[key]]));
          writeFileSync('.ci-diagnostics/gates.json',JSON.stringify(gates,null,2)+'\n');
          console.log(gates);
          if(Object.values(gates).some(value=>value!=='success'))process.exitCode=1;
          NODE
      - name: Preserve diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: email-preview-stack-${{ github.run_id }}
          path: .ci-diagnostics/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
