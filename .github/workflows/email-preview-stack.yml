name: Email preview stack checks

on:
  push:
    branches:
      - codex/author-kit-external-email-alpha32
      - codex/email-preview-host-reviewed-20261013
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character source commit to check
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: email-preview-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      RAYON_NUM_THREADS: '1'
      UV_THREADPOOL_SIZE: '1'
      NEXT_PUBLIC_APP_URL: __DEFT_APP_URL__
      NEXT_PUBLIC_API_URL: __DEFT_API_URL__
      NEXT_PUBLIC_WS_URL: __DEFT_WS_URL__
      NEXT_PUBLIC_FEATURE_APPS: 'true'
      NEXT_PUBLIC_FEATURE_APP_RESOURCE_SYNC: 'true'
      NEXT_PUBLIC_FEATURE_APP_ATTACHMENT_BROKER: 'true'
      NEXT_PUBLIC_DEFT_SELF_HOSTED: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - name: Record source and runner capacity
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          mkdir -p .ci-diagnostics
          git rev-parse HEAD > .ci-diagnostics/source-commit.txt
          free -m > .ci-diagnostics/memory-before.txt
          df -m . > .ci-diagnostics/disk-before.txt
          requested="$REQUESTED_COMMIT"
          if [ -n "$requested" ]; then
            [[ "$requested" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-parse HEAD)" = "$requested"
          fi
          test "$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)" -ge 8388608
          test "$(df -Pk . | awk 'NR==2 {print $4}')" -ge 8388608
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact dependency graph
        id: install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci-diagnostics/install.log
      - name: Full Kit normal and packed consumer suite
        id: kit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/app-kit test 2>&1 | tee .ci-diagnostics/kit-normal-packed.log
      - name: Full candidate API typecheck
        id: api
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/api exec tsc -p tsconfig.typecheck.json --incremental false 2>&1 | tee .ci-diagnostics/api-typecheck.log
      - name: Full candidate Web typecheck
        id: web
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/web exec tsc --noEmit --incremental false 2>&1 | tee .ci-diagnostics/web-typecheck.log
      - name: Exposure error mapping and schema contract regressions
        id: focused
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/api exec tsx --test --test-concurrency=1 test/app-http-exposure-error.test.ts test/email-account-catalog.test.ts 2>&1 | tee .ci-diagnostics/host-focused.log
          node --test apps/api/test/app-owner-context-history.test.mjs 2>&1 | tee .ci-diagnostics/owner-context-history.log
          node --test packages/db/scripts/fresh-schema-contracts.test.mjs packages/db/scripts/fresh-native-bootstrap.test.mjs packages/db/scripts/fresh-bootstrap-sql.test.mjs 2>&1 | tee .ci-diagnostics/schema-contracts.log
          node --test packages/db/scripts/reviewed-lineage-artifacts.test.mjs 2>&1 | tee .ci-diagnostics/reviewed-lineage-artifacts.log
          pnpm --filter @deft/shared exec tsx --test test/native-mentions.test.ts 2>&1 | tee .ci-diagnostics/native-mention-contracts.log
          pnpm --filter @deft/web exec tsx --test src/lib/email-native-navigation.test.ts src/lib/app-integration-choice-response.test.ts src/lib/app-experience-action-confirmation.test.ts 2>&1 | tee .ci-diagnostics/native-email-navigation.log
          node --test apps/web/src/lib/app-experience-consent-presentation.test.mjs 2>&1 | tee .ci-diagnostics/consent-presentation.log
      - name: Compile production Web
        id: build
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm --filter @deft/web exec next build --webpack 2>&1 | tee .ci-diagnostics/web-build.log
      - name: Report every gate and fail incomplete closure
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          KIT: ${{ steps.kit.outcome }}
          API: ${{ steps.api.outcome }}
          WEB: ${{ steps.web.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          mkdir -p .ci-diagnostics
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const gates=Object.fromEntries(['INSTALL','KIT','API','WEB','FOCUSED','BUILD'].map(key=>[key,process.env[key]]));
          writeFileSync('.ci-diagnostics/gates.json',JSON.stringify(gates,null,2)+'\n');
          console.log(gates);
          if(Object.values(gates).some(value=>value!=='success'))process.exitCode=1;
          NODE
      - name: Preserve diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: email-preview-stack-${{ github.run_id }}
          path: .ci-diagnostics/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  api-regressions:
    needs: closure
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deft_preview_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/deft_preview_test
      DEFT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/deft_preview_test
      JWT_SECRET: ci-test-secret-not-for-prod
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-prod
      ANTHROPIC_API_KEY: sk-ant-ci-dummy-not-a-real-key
      DEFT_TEST_TIMEOUT_MS: '900000'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Record exact source and initialize test diagnostics
        run: |
          mkdir -p .ci-api-diagnostics
          git rev-parse HEAD > .ci-api-diagnostics/source-commit.txt
          free -m > .ci-api-diagnostics/memory-before.txt
          test "$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)" -ge 8388608
      - name: Install exact dependency graph
        id: api_install
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee .ci-api-diagnostics/install.log
      - name: Initialize disposable reviewed schema and fixtures
        id: api_schema
        run: |
          set -o pipefail
          pnpm --filter @deft/app-kit build 2>&1 | tee .ci-api-diagnostics/kit-build.log
          pnpm db:push-full 2>&1 | tee .ci-api-diagnostics/fresh-schema.log
          pnpm db:seed 2>&1 | tee .ci-api-diagnostics/seed-platform.log
      - name: Preserve disposable catalog after schema success or refusal
        if: always() && steps.api_install.outcome == 'success'
        run: |
          pnpm --filter @deft/db exec node --input-type=module <<'NODE'
          import pg from 'pg';
          import {writeFileSync} from 'node:fs';
          import {readCatalog} from './scripts/lineage-catalog.mjs';
          const client=new pg.Client({connectionString:process.env.DATABASE_URL});
          await client.connect();
          try{
            await client.query('BEGIN');
            const present=(await client.query("SELECT to_regclass('public.deft_schema_migrations') IS NOT NULL AS present")).rows[0].present;
            if(!present)await client.query(`CREATE TABLE deft_schema_migrations (
              version text PRIMARY KEY, description text NOT NULL, checksum text NOT NULL,
              kind text NOT NULL CHECK (kind IN ('baseline', 'migration')),
              applied_at timestamptz NOT NULL DEFAULT now())`);
            const value={...(await readCatalog(client)),temporary_ledger_shell:!present};
            writeFileSync(process.env.GITHUB_WORKSPACE+'/.ci-api-diagnostics/catalog-after-schema.json',JSON.stringify(value,null,2)+'\n');
            console.log('Disposable structural catalog:',value.digest);
          }finally{await client.query('ROLLBACK');await client.end();}
          NODE
      - name: Full API regression suite
        id: api_suite
        run: |
          set -o pipefail
          pnpm --filter @deft/api test 2>&1 | tee .ci-api-diagnostics/api-suite.log
      - name: Preserve actual API gate outcomes
        if: always()
        env:
          INSTALL: ${{ steps.api_install.outcome }}
          SCHEMA: ${{ steps.api_schema.outcome }}
          API: ${{ steps.api_suite.outcome }}
        run: |
          mkdir -p .ci-api-diagnostics
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const gates=Object.fromEntries(['INSTALL','SCHEMA','API'].map(key=>[key,process.env[key]]));
          writeFileSync('.ci-api-diagnostics/gates.json',JSON.stringify(gates,null,2)+'\n');
          console.log(gates);
          if(Object.values(gates).some(value=>value!=='success'))process.exitCode=1;
          NODE
      - name: Preserve API diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: email-preview-api-${{ github.run_id }}
          path: .ci-api-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  security:
    needs: [closure, api-regressions]
    if: always() && needs.closure.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: github/codeql-action/init@v4.38.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4.38.1
        with:
          output: .ci-security-diagnostics
          upload: never
          upload-database: false
      - name: Fail unresolved security findings and preserve their locations
        run: |
          node --input-type=module <<'NODE'
          import {readdirSync,readFileSync,writeFileSync} from 'node:fs';
          const directory='.ci-security-diagnostics';
          const findings=[];
          const files=readdirSync(directory).filter(name=>name.endsWith('.sarif'));
          if(!files.length)throw Error('CodeQL produced no SARIF evidence');
          for(const file of files){
            for(const run of JSON.parse(readFileSync(directory+'/'+file,'utf8')).runs){
              for(const result of run.results??[])findings.push({rule:result.ruleId,level:result.level??'warning',locations:result.locations});
            }
          }
          writeFileSync(directory+'/findings.json',JSON.stringify(findings,null,2)+'\n');
          console.log('Unresolved CodeQL findings:',findings.length);
          if(findings.length)process.exitCode=1;
          NODE
      - name: Preserve full security findings without suppressions
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: email-preview-security-${{ github.run_id }}
          path: .ci-security-diagnostics/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
