name: Security

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: read

concurrency:
  # A new push to the same pull request cancels that pull request's superseded run of this workflow.
  # Every other event (master push, tag, schedule, manual dispatch) gets a
  # unique group per run (as is any manual re-run, so an old re-run cannot cancel a newer push), so it is never cancelled and never queued behind another.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm audit --audit-level low

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    # Content-pinned dispositions compare the complete repository finding set.
    # PR diff filtering omits unchanged reviewed paths and creates stale reviews.
    env:
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
      CODEQL_OVERLAY_DATABASE_MODE: none
    permissions:
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.39.0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4.39.0
        id: analyze
        with:
          output: .ci-codeql-diagnostics
          upload: never
      # Line drift is allowed; changes to flagged source/flow lines require review.
      - name: Verify exact reviewed dispositions; reject new or changed findings
        id: dispositions
        run: |
          node --test scripts/codeql-reviewed-findings.test.mjs
          node scripts/codeql-reviewed-findings.mjs .ci-codeql-diagnostics
      # Keep GitHub's raw alerts visible, including every unresolved finding.
      # Accepted false positives require explicit GitHub alert dispositions;
      # external SARIF suppressions alone are not assumed to affect its check.
      - uses: github/codeql-action/upload-sarif@v4.39.0
        if: always() && steps.analyze.outcome == 'success'
        with:
          sarif_file: .ci-codeql-diagnostics/javascript.sarif
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: canonical-codeql-${{ github.run_id }}
          path: .ci-codeql-diagnostics/
          include-hidden-files: true
