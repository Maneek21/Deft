name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint web
        run: pnpm --filter @deft/web lint
      - name: Test web realtime lifecycle state
        run: >-
          pnpm --filter @deft/web exec tsx --test
          src/lib/huddle-state.test.ts
          src/lib/socket.test.ts
          src/lib/space-socket.test.ts
      - name: Type check API
        run: cd apps/api && npx tsc --noEmit
      - name: Type check Web
        run: cd apps/web && npx tsc --noEmit

  test:
    name: Test API
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/deft_test
      DEFT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/deft_test
      JWT_SECRET: ci-test-secret-not-for-prod
      JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-prod
      # Fake, non-functional key. The memory-extract tests mock the Anthropic
      # HTTP call, but the SDK throws at construction when no key is set, and
      # the agent-reply dispatch is gated on the key being present. Setting a
      # dummy unblocks both without ever making a real API call.
      ANTHROPIC_API_KEY: sk-ant-ci-dummy-not-a-real-key
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enable pgvector extension
        run: psql "$DATABASE_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"
      - name: Push schema
        run: pnpm --filter @deft/db push-full
      - name: Seed demo data + platform bundles
        # Tests depend on the seeded credentials (maneek@test.com /
        # test1234) and on the Alex PM bundled-template employee.
        # seed-demo.ts explicitly enumerates CI + the apps/api/test
        # suite as supported callers; without this step, login-based
        # tests get 401 and templates assertions fail.
        run: pnpm db:seed:demo
      - name: Seed canonical test fixtures
        # seed-demo uses random ids, but a chunk of the suite hardcodes fixed
        # org/user/agent ids from the original dev-db snapshot. This adds
        # exactly those fixed-id rows (idempotent, isolated). Without it ~13
        # tests fail with FK violations / 0-row assertions.
        run: pnpm --filter @deft/api exec tsx src/scripts/seed-test-fixtures.ts
      - name: Run tests
        run: pnpm --filter @deft/api test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @deft/web build

  versioned-upgrade:
    name: Versioned Upgrade
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deft_upgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/deft_upgrade
      BASELINE_IMAGE: ghcr.io/maneek21/deft:0.2.0-preview.1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create preview-release database
        run: |
          set -euo pipefail
          docker pull "$BASELINE_IMAGE"
          docker run --rm --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e ENCRYPTION_KEY=12345678901234567890123456789012 \
            --entrypoint sh "$BASELINE_IMAGE" \
            -c 'pnpm db:push-full && pnpm db:seed:demo'
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM orgs WHERE slug = 'testers-tomatoes') THEN
                RAISE EXCEPTION 'preview seed org missing';
              END IF;
              IF (SELECT count(*) FROM users) < 6 THEN
                RAISE EXCEPTION 'preview seed users missing';
              END IF;
            END \$\$;
          "
      - name: Inspect and dry-run without writing a ledger
        run: |
          if pnpm db:assert-fresh; then
            echo 'fresh initializer accepted an existing release database' >&2
            exit 1
          fi
          pnpm db:upgrade --status
          pnpm db:upgrade --dry-run
          test "$(psql "$DATABASE_URL" -Atc "SELECT to_regclass('public.deft_schema_migrations') IS NULL")" = "t"
      - name: Adopt baseline and prove idempotency
        run: |
          pnpm db:upgrade
          pnpm db:upgrade
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            DO \$\$
            BEGIN
              IF (SELECT count(*) FROM deft_schema_migrations WHERE version = '0.2.0-preview.1' AND kind = 'baseline') <> 1 THEN
                RAISE EXCEPTION 'baseline ledger row missing or duplicated';
              END IF;
              IF NOT EXISTS (SELECT 1 FROM orgs WHERE slug = 'testers-tomatoes') THEN
                RAISE EXCEPTION 'seeded org was not preserved';
              END IF;
              IF (SELECT count(*) FROM users) < 6 THEN
                RAISE EXCEPTION 'seeded users were not preserved';
              END IF;
            END \$\$;
          "
      - name: Run upgrade unit tests
        run: pnpm test:upgrade

  docker-build:
    name: Production Image + Browser Smoke
    # The production Dockerfile drifted multiple times without being noticed
    # because nobody runs `docker build` locally during dev (we use `pnpm dev`).
    # First deploy from a fresh clone surfaced 5 Dockerfile bugs in one go.
    # This job exercises the full image build on every PR so the same class of
    # rot can't sneak back in.
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: deft:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Huddles are a compile-time Next.js flag. Keep this image aligned
          # with the official release contract exercised by the smoke below.
          build-args: |
            NEXT_PUBLIC_APP_URL=http://localhost:3000
            NEXT_PUBLIC_API_URL=http://localhost:3001
            NEXT_PUBLIC_WS_URL=http://localhost:3001
            NEXT_PUBLIC_FEATURE_HUDDLES=true
      - name: Smoke-test the image (binaries resolve)
        # Catches the "next CLI not on PATH from apps/web" and
        # "pnpm not in runner stage" classes of bug — both real bugs we hit
        # on the first deploy. Doesn't start the actual servers (that'd need
        # a Postgres sidecar and would duplicate the `test` job's work).
        run: |
          docker run --rm --entrypoint sh deft:ci -c '
            set -e
            command -v pnpm
            command -v node
            cd /app/apps/web && pnpm exec next --version
            test -d /app/apps/api && test -d /app/packages/db
            test -d /app/apps/web/node_modules
            test -d /app/packages/mcp/node_modules
          '
      - name: Start production-image test stack
        env:
          POSTGRES_PASSWORD: browser-smoke-postgres
          JWT_SECRET: browser-smoke-jwt-secret
          JWT_REFRESH_SECRET: browser-smoke-refresh-secret
          # Quote this value: otherwise YAML parses the digits as a number and
          # exports it in scientific notation, shortening it below 32 chars.
          ENCRYPTION_KEY: "ci-browser-smoke-encryption-key-32"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_WS_URL: http://127.0.0.1:3001
        run: |
          set -euo pipefail
          docker network create deft-browser-smoke
          docker run -d --name deft-browser-postgres --network deft-browser-smoke \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            -e POSTGRES_DB=deft \
            pgvector/pgvector:pg16
          for attempt in $(seq 1 30); do
            docker exec deft-browser-postgres pg_isready -U postgres >/dev/null 2>&1 && break
            if [ "$attempt" = 30 ]; then echo 'database did not become ready'; exit 1; fi
            sleep 2
          done
          docker run --rm --network deft-browser-smoke \
            -e DATABASE_URL="postgres://postgres:$POSTGRES_PASSWORD@deft-browser-postgres:5432/deft" \
            -e ENCRYPTION_KEY="$ENCRYPTION_KEY" \
            --entrypoint sh deft:ci -c 'pnpm db:push-full && pnpm db:seed:demo'
          docker run --rm --network deft-browser-smoke \
            -e DATABASE_URL="postgres://postgres:$POSTGRES_PASSWORD@deft-browser-postgres:5432/deft" \
            -e DEFT_TEST_EMAIL=diego@testers-tomatoes.com \
            -e DEFT_APPROVAL_SMOKE_MARKER="CI approval smoke $GITHUB_RUN_ID" \
            --entrypoint sh deft:ci -c 'pnpm test:product-browser:seed'
          docker run -d --name deft-browser-app --network deft-browser-smoke \
            -p 3000:3000 -p 3001:3001 \
            -e DATABASE_URL="postgres://postgres:$POSTGRES_PASSWORD@deft-browser-postgres:5432/deft" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
            -e ENCRYPTION_KEY="$ENCRYPTION_KEY" \
            -e NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
            -e NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
            -e NEXT_PUBLIC_WS_URL="$NEXT_PUBLIC_WS_URL" \
            deft:ci
          for attempt in $(seq 1 45); do
            curl --fail --silent http://127.0.0.1:3001/health >/dev/null && \
              curl --fail --silent http://127.0.0.1:3000/login >/dev/null && break
            if [ "$attempt" = 45 ]; then docker logs deft-browser-app; exit 1; fi
            sleep 2
          done
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production browser smoke
        env:
          DEFT_WEB_URL: http://127.0.0.1:3000
          DEFT_TEST_EMAIL: diego@testers-tomatoes.com
          DEFT_TEST_PASSWORD: tomato123
          DEFT_APPROVAL_SMOKE_MARKER: CI approval smoke ${{ github.run_id }}
        run: pnpm test:product-browser
      - name: Block critical production-image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deft:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Dump product stack logs on failure
        if: failure()
        run: docker logs deft-browser-app || true
      - name: Stop product test stack
        if: always()
        run: |
          docker rm -f deft-browser-app deft-browser-postgres 2>/dev/null || true
          docker network rm deft-browser-smoke 2>/dev/null || true
