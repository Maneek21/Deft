name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: maneek21/deft

jobs:
  publish:
    name: Publish release image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          [[ "$tag" == v* ]] || { echo "Release tag must start with v" >&2; exit 1; }
          git rev-parse "$tag^{commit}" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}

      - name: Build and publish amd64 image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC feature flags are compiled into the browser bundle;
          # setting this only on the running container is too late.
          build-args: |
            NEXT_PUBLIC_FEATURE_HUDDLES=true
            VCS_REF=${{ steps.release.outputs.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ steps.release.outputs.sha }}

      - name: Attest image provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Sign release image digest
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        shell: bash
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify signature and provenance
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
        shell: bash
        run: |
          cosign verify "$IMAGE_REF" \
            --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null
          gh attestation verify "oci://$IMAGE_REF" --repo "$GITHUB_REPOSITORY"

      - name: Generate release manifest
        shell: bash
        run: |
          mkdir -p dist
          cp docker-compose.yml compose.prod.yml compose.release.yml .env.example LICENSE NOTICE THIRD-PARTY-LICENSES.md dist/
          cat > dist/release-manifest.json <<JSON
          {
            "schema": "deft.release.v1",
            "tag": "${{ steps.release.outputs.tag }}",
            "commit": "${{ steps.release.outputs.sha }}",
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}",
            "digest": "${{ steps.image.outputs.digest }}",
            "signature": "sigstore-keyless",
            "signature_identity": "https://github.com/${{ github.workflow_ref }}",
            "provenance": "github-build-attestation",
            "license": "AGPL-3.0-only",
            "source": "https://github.com/${{ github.repository }}/tree/${{ steps.release.outputs.sha }}",
            "platforms": ["linux/amd64"],
            "upgrade_support": "versioned-from-v0.2.0-preview.1"
          }
          JSON

      - name: Attach exact corresponding source
        shell: bash
        run: |
          git archive \
            --format=tar.gz \
            --prefix="deft-${{ steps.release.outputs.version }}/" \
            --output="dist/deft-${{ steps.release.outputs.version }}-source.tar.gz" \
            "${{ steps.release.outputs.sha }}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: dist/deft-${{ steps.release.outputs.version }}.spdx.json

      - name: Generate checksums
        shell: bash
        run: (cd dist && sha256sum -- * .env.example > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.release.outputs.version, '-') }}
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "Deft ${{ steps.release.outputs.tag }}" --generate-notes --verify-tag)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          # dist/* does not match dotfiles; attach .env.example explicitly.
          gh release create "${{ steps.release.outputs.tag }}" dist/* dist/.env.example "${args[@]}"
