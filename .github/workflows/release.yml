name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
      reuse_existing_image:
        description: Reuse an already-published and tag-signed image after a packaging failure
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: maneek21/deft

jobs:
  certify:
    name: Certify Hermes employee release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deft_hermes_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/deft_hermes_release_test
      DEFT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/deft_hermes_release_test
      JWT_SECRET: release-hermes-gate-jwt-not-for-prod
      JWT_REFRESH_SECRET: release-hermes-gate-refresh-not-for-prod
      ANTHROPIC_API_KEY: sk-ant-release-hermes-gate-dummy-not-real
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Run two clean-state Hermes employee passes
        run: pnpm test:hermes-employee-release-gate
      - name: Publish certification evidence
        uses: actions/upload-artifact@v4
        with:
          name: hermes-employee-release-certification
          path: dist/hermes-employee-release-gate.json
          if-no-files-found: error

  publish:
    name: Publish release image
    runs-on: ubuntu-latest
    needs: certify
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          [[ "$tag" == v* ]] || { echo "Release tag must start with v" >&2; exit 1; }
          git rev-parse "$tag^{commit}" >/dev/null
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          [[ "$package_version" == "$version" ]] || {
            echo "package.json version $package_version does not match release $version" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "$tag^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Download Hermes employee certification
        uses: actions/download-artifact@v4
        with:
          name: hermes-employee-release-certification
          path: dist

      - name: Verify certification matches release commit
        shell: bash
        run: |
          certificate_commit="$(node -p "require('./dist/hermes-employee-release-gate.json').commit")"
          [[ "$certificate_commit" == "${{ steps.release.outputs.sha }}" ]] || {
            echo "Hermes employee certificate does not match the release commit" >&2
            exit 1
          }

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}

      - name: Build and publish amd64 image
        id: image
        if: github.event_name != 'workflow_dispatch' || !inputs.reuse_existing_image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC feature flags are compiled into the browser bundle;
          # setting this only on the running container is too late.
          build-args: |
            NEXT_PUBLIC_FEATURE_HUDDLES=true
            DEFT_RELEASE_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ steps.release.outputs.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ steps.release.outputs.sha }}

      - name: Resolve existing signed image digest
        id: existing
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_existing_image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          digest="$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Existing release image did not resolve to an immutable digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable release digest
        id: digest
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          REUSED_DIGEST: ${{ steps.existing.outputs.digest }}
        shell: bash
        run: |
          digest="${REUSED_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Release image digest is missing or invalid" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        if: steps.existing.outputs.digest == ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Sign release image digest
        if: steps.existing.outputs.digest == ''
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        shell: bash
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify signature and provenance
        id: verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REUSED_DIGEST: ${{ steps.existing.outputs.digest }}
        shell: bash
        run: |
          if [[ -n "$REUSED_DIGEST" ]]; then
            identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          else
            identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          fi
          cosign verify "$IMAGE_REF" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null
          gh attestation verify "oci://$IMAGE_REF" --repo "$GITHUB_REPOSITORY"
          echo "signature_identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Generate release manifest
        shell: bash
        run: |
          mkdir -p dist
          cp docker-compose.yml compose.prod.yml compose.release.yml LICENSE NOTICE THIRD-PARTY-LICENSES.md dist/
          # GitHub release assets cannot retain a leading dot reliably. Publish
          # the template under a stable explicit name so downloaded checksums
          # match the asset name on every client.
          cp .env.example dist/default.env.example
          cat > dist/release-manifest.json <<JSON
          {
            "schema": "deft.release.v1",
            "tag": "${{ steps.release.outputs.tag }}",
            "commit": "${{ steps.release.outputs.sha }}",
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}",
            "digest": "${{ steps.digest.outputs.digest }}",
            "signature": "sigstore-keyless",
            "signature_identity": "${{ steps.verification.outputs.signature_identity }}",
            "provenance": "github-build-attestation",
            "license": "AGPL-3.0-only",
            "source": "https://github.com/${{ github.repository }}/tree/${{ steps.release.outputs.sha }}",
            "platforms": ["linux/amd64"],
            "upgrade_support": "versioned-from-v0.2.0-preview.1",
            "agent_channel_protocol": "deft.agent_channel.v2",
            "hermes_integration": "deft-hermes-integration-${{ steps.release.outputs.version }}.tar.gz",
            "hermes_employee_certification": "hermes-employee-release-gate.json"
          }
          JSON

      - name: Attach exact corresponding source
        shell: bash
        run: |
          git archive \
            --format=tar.gz \
            --prefix="deft-${{ steps.release.outputs.version }}/" \
            --output="dist/deft-${{ steps.release.outputs.version }}-source.tar.gz" \
            "${{ steps.release.outputs.sha }}"

      - name: Build matched Hermes integration bundle
        shell: bash
        run: |
          node scripts/build-hermes-integration-bundle.mjs
          tar -czf "dist/deft-hermes-integration-${{ steps.release.outputs.version }}.tar.gz" -C dist/hermes-integration .
          rm -rf dist/hermes-integration

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: dist/deft-${{ steps.release.outputs.version }}.spdx.json

      - name: Generate checksums
        shell: bash
        run: (cd dist && sha256sum -- * > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.release.outputs.version, '-') }}
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "Deft ${{ steps.release.outputs.tag }}" --generate-notes --verify-tag)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          gh release create "${{ steps.release.outputs.tag }}" dist/* "${args[@]}"
