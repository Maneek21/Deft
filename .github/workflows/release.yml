name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
      reuse_existing_image:
        description: Reuse an already-published and tag-signed image after a packaging failure
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: maneek21/deft

jobs:
  certify:
    name: Certify Hermes employee release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deft_hermes_release_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/deft_hermes_release_test
      DEFT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/deft_hermes_release_test
      JWT_SECRET: release-hermes-gate-jwt-not-for-prod
      JWT_REFRESH_SECRET: release-hermes-gate-refresh-not-for-prod
      ANTHROPIC_API_KEY: sk-ant-release-hermes-gate-dummy-not-real
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 11.10.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pnpm install --frozen-lockfile
      - name: Resolve certification release identity
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$tag" == v* ]] || { echo "Release tag must start with v" >&2; exit 1; }
          tag_commit="$(git rev-parse "$tag^{commit}")"
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]] || {
            echo "Certification checkout does not match release tag $tag" >&2
            exit 1
          }
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          [[ "$package_version" == "$version" ]] || {
            echo "package.json version $package_version does not match release $version" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_commit" >> "$GITHUB_OUTPUT"
      - name: Provision pinned Hermes runtime
        shell: bash
        run: |
          set -euo pipefail
          hermes_repository="$(node -p "require('./integrations/hermes/integration-manifest.json').hermes_tested.repository")"
          hermes_ref="$(node -p "require('./integrations/hermes/integration-manifest.json').hermes_tested.ref")"
          hermes_commit="$(node -p "require('./integrations/hermes/integration-manifest.json').hermes_tested.commit")"
          hermes_root="$RUNNER_TEMP/hermes-agent"
          hermes_venv="$RUNNER_TEMP/hermes-venv"
          rm -rf "$hermes_root" "$hermes_venv"
          git clone --filter=blob:none --no-checkout "$hermes_repository" "$hermes_root"
          git -C "$hermes_root" fetch --depth 1 origin "$hermes_ref"
          git -C "$hermes_root" checkout --detach FETCH_HEAD
          [[ "$(git -C "$hermes_root" rev-parse HEAD)" == "$hermes_commit" ]] || {
            echo "Hermes ref does not resolve to its manifest commit" >&2
            exit 1
          }
          [[ -z "$(git -C "$hermes_root" status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Pinned Hermes checkout is not clean" >&2
            exit 1
          }
          python -m venv "$hermes_venv"
          "$hermes_venv/bin/python" -m pip install -e "$hermes_root"
          [[ -z "$(git -C "$hermes_root" status --porcelain=v1 --untracked-files=all)" ]] || {
            echo "Installing Hermes modified the provenance checkout" >&2
            exit 1
          }
          "$hermes_venv/bin/python" -c 'import sys; print(sys.version)'
          echo "DEFT_HERMES_REPO=$hermes_root" >> "$GITHUB_ENV"
          echo "DEFT_HERMES_PYTHON=$hermes_venv/bin/python" >> "$GITHUB_ENV"
      - name: Run two clean-state Hermes employee passes
        env:
          DEFT_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DEFT_RELEASE_COMMIT: ${{ steps.release.outputs.sha }}
        run: pnpm test:hermes-employee-release-gate
      - name: Publish certification evidence
        uses: actions/upload-artifact@v7
        with:
          name: hermes-employee-release-certification
          path: |
            dist/hermes-employee-release-gate.json
            dist/hermes-integration
          if-no-files-found: error

  publish:
    name: Publish release image
    runs-on: ubuntu-latest
    needs: certify
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve release tag
        id: release
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$tag" == v* ]] || { echo "Release tag must start with v" >&2; exit 1; }
          tag_commit="$(git rev-parse "$tag^{commit}")"
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]] || {
            echo "Publish checkout does not match release tag $tag" >&2
            exit 1
          }
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          [[ "$package_version" == "$version" ]] || {
            echo "package.json version $package_version does not match release $version" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Download Hermes employee certification
        uses: actions/download-artifact@v4
        with:
          name: hermes-employee-release-certification
          path: dist

      - name: Verify carried Hermes certificate and bundle
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.sha }}
          HERMES_CERTIFICATE_PATH: dist/hermes-employee-release-gate.json
          HERMES_BUNDLE_EVIDENCE_PATH: ${{ runner.temp }}/hermes-bundle-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-hermes-integration-bundle.mjs --json dist/hermes-integration > "$HERMES_BUNDLE_EVIDENCE_PATH"
          node scripts/generate-release-manifest.mjs --verify-only

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=sha-${{ steps.release.outputs.sha }}

      - name: Build and publish amd64 image
        id: image
        if: github.event_name != 'workflow_dispatch' || !inputs.reuse_existing_image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC feature flags are compiled into the browser bundle;
          # setting this only on the running container is too late.
          build-args: |
            NEXT_PUBLIC_FEATURE_HUDDLES=true
            DEFT_RELEASE_VERSION=${{ steps.release.outputs.version }}
            VCS_REF=${{ steps.release.outputs.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ steps.release.outputs.sha }}

      - name: Resolve existing signed image digest
        id: existing
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_existing_image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          digest="$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Existing release image did not resolve to an immutable digest" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable release digest
        id: digest
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          REUSED_DIGEST: ${{ steps.existing.outputs.digest }}
        shell: bash
        run: |
          digest="${REUSED_DIGEST:-$BUILT_DIGEST}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || {
            echo "Release image digest is missing or invalid" >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        if: steps.existing.outputs.digest == ''
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6

      - name: Sign release image digest
        if: steps.existing.outputs.digest == ''
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
        shell: bash
        run: cosign sign --yes "$IMAGE_REF"

      - name: Verify signature and provenance
        id: verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          REUSED_DIGEST: ${{ steps.existing.outputs.digest }}
        shell: bash
        run: |
          if [[ -n "$REUSED_DIGEST" ]]; then
            identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}"
          else
            identity="https://github.com/${GITHUB_WORKFLOW_REF}"
          fi
          cosign verify "$IMAGE_REF" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" >/dev/null
          gh attestation verify "oci://$IMAGE_REF" --repo "$GITHUB_REPOSITORY"
          echo "signature_identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Collect portable release assets
        shell: bash
        run: |
          mkdir -p dist
          cp docker-compose.yml compose.prod.yml compose.release.yml LICENSE NOTICE THIRD-PARTY-LICENSES.md dist/
          # GitHub release assets cannot retain a leading dot reliably. Publish
          # the template under a stable explicit name so downloaded checksums
          # match the asset name on every client.
          cp .env.example dist/default.env.example

      - name: Attach exact corresponding source
        shell: bash
        run: |
          git archive \
            --format=tar.gz \
            --prefix="deft-${{ steps.release.outputs.version }}/" \
            --output="dist/deft-${{ steps.release.outputs.version }}-source.tar.gz" \
            "${{ steps.release.outputs.sha }}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: dist/deft-${{ steps.release.outputs.version }}.spdx.json

      - name: Archive and reverify the carried Hermes integration
        env:
          HERMES_BUNDLE_EVIDENCE_PATH: ${{ runner.temp }}/hermes-bundle-evidence.json
        shell: bash
        run: |
          set -euo pipefail
          prearchive_evidence="$RUNNER_TEMP/hermes-bundle-prearchive-evidence.json"
          archive_evidence="$RUNNER_TEMP/hermes-bundle-archive-evidence.json"
          archive_verify_root="$(mktemp -d "$RUNNER_TEMP/hermes-archive-verify.XXXXXX")"
          trap 'rm -rf "$archive_verify_root"' EXIT
          node scripts/verify-hermes-integration-bundle.mjs --json dist/hermes-integration > "$prearchive_evidence"
          cmp --silent "$HERMES_BUNDLE_EVIDENCE_PATH" "$prearchive_evidence" || {
            echo "Hermes bundle changed after certification download" >&2
            exit 1
          }
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner --format=gnu \
            -cf - -C dist/hermes-integration . \
            | gzip -n > "dist/deft-hermes-integration-${{ steps.release.outputs.version }}.tar.gz"
          tar -xzf "dist/deft-hermes-integration-${{ steps.release.outputs.version }}.tar.gz" \
            -C "$archive_verify_root"
          node scripts/verify-hermes-integration-bundle.mjs --json "$archive_verify_root" > "$archive_evidence"
          cmp --silent "$HERMES_BUNDLE_EVIDENCE_PATH" "$archive_evidence" || {
            echo "Hermes integration archive does not match its certified bundle" >&2
            exit 1
          }
          rm -rf dist/hermes-integration

      - name: Generate release manifest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_COMMIT: ${{ steps.release.outputs.sha }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.release.outputs.version }}
          RELEASE_IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          RELEASE_SIGNATURE_IDENTITY: ${{ steps.verification.outputs.signature_identity }}
          RELEASE_SOURCE_URL: https://github.com/${{ github.repository }}/tree/${{ steps.release.outputs.sha }}
          HERMES_CERTIFICATE_PATH: dist/hermes-employee-release-gate.json
          HERMES_BUNDLE_EVIDENCE_PATH: ${{ runner.temp }}/hermes-bundle-evidence.json
          HERMES_ARCHIVE_PATH: dist/deft-hermes-integration-${{ steps.release.outputs.version }}.tar.gz
          RELEASE_MANIFEST_PATH: dist/release-manifest.json
        run: node scripts/generate-release-manifest.mjs

      - name: Generate checksums
        shell: bash
        run: (cd dist && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(steps.release.outputs.version, '-') }}
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "Deft ${{ steps.release.outputs.tag }}" --generate-notes --verify-tag)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          gh release create "${{ steps.release.outputs.tag }}" dist/* "${args[@]}"
