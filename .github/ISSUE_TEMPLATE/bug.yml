name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please complete the form so we can reproduce the issue.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: I expected X but got Y...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `pnpm db:push-full`
        2. Sign up at /signup
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit SHA
      placeholder: v0.1.0-alpha or commit abc1234
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is Deft deployed?
      options:
        - Docker compose (self-host)
        - Local dev (pnpm dev)
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: API logs, browser console, or worker output. Redact secrets.
      render: shell
