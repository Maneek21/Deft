packages:
  - 'apps/*'
  - 'packages/*'
  - '!apps/web-demo'
auditConfig:
  ignoreGhsas:
    # Added 18 Nov 2026. No patched picomatch is published.
    # Remove when picomatch > 4.0.7 with the fix is out and bump in the same PR.
    # Revisit by 2 Dec 2026; pnpm 11.10.0 does not support ignore expiry dates.
    - GHSA-fc5q-39xc-vjpf
overrides:
  '@hono/node-server': ^2.0.12
  body-parser: ^2.3.0
  braces: npm:@dieub/braces-depth-guard@3.0.3-pn.3
  'brace-expansion@<2.0.0': ^1.1.18
  'brace-expansion@>=4.0.0 <6.0.0': ^5.0.9
  engine.io: ^6.6.7
  esbuild: ^0.28.1
  fast-uri: ^3.1.5
  # 21.0.4 fixes GHSA-834v-8h66-3h79 and GHSA-c8p4-j97h-3vg8 (server-side HTML parsing).
  happy-dom: 21.0.4
  hono: ^4.13.16
  ip-address: ^10.3.1
  js-yaml: ^4.3.2
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1
  nanoid: ^3.3.17
  postcss: ^8.5.23
  qs: ^6.15.2
  sharp: ^0.35.5
  source-map-js: ^1.2.2
  socket.io-parser: ^4.2.7
  ws: ^8.21.0
peerDependencyRules:
  allowedVersions:
    # @tiptap/html 3.32.0 declares happy-dom ^20.8.9; the override above moves
    # every copy to the patched 21.0.4 (TipTap allows ^21.0.4 from 3.35.0).
    '@tiptap/html>happy-dom': 21.0.4
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
# This exact release is the audited security update that brings native Sharp
# 0.35 support and patched PostCSS. Permit it through pnpm release-age gates.
minimumReleaseAgeExclude:
  - '@next/env@16.3.0'
  - '@next/eslint-plugin-next@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - eslint-config-next@16.3.0
  - next@16.3.0
